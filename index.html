<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS GAME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1> Rock Paper Scissors</h1>

    <div class="choices">

        <div class="choice" id="Rock">
    <img src="images/rock.jpg" alt="Rock images">
    </div>

     <div class="choice" id="paper">
    <img src="images/scissor.jpg" alt="Scissor images">
    </div>

     <div class="choice" id="scissor">
    <img src="images/paper.jpg" alt="Paper images">
    </div>

</div>

 <div class="scard">
    <div class="score">
        <p id="user">0</p>
        <p>User</p>
    </div>

    <div class="score">
        <p id="computer">0</p>
        <p>Comp</p>
    </div>
</div>

<div class="print">
    <p id="msg">Play your move!</p>
</div>

<div class="reset-box">
    <button id="reset">Reset Game</button>
</div>

 <script src="app.js"></script>
</body>
</html>
